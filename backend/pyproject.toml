[project]
name = "daniedesign-backend"
version = "0.1.0"
description = "Danie Design backend API"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "resend>=0.8.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.1",
    "pillow>=10.2.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1.0",
]

[tool.uv]
package = false
